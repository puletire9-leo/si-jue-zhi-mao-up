[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "selection-agent"
version = "0.1.0"
description = "选品Agent - 基于Hermes框架的Amazon选品分析系统"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openai==2.24.0",
  "python-dotenv==1.2.2",
  "httpx[socks]==0.28.1",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "ruamel.yaml==0.18.17",
  "pydantic==2.13.4",
  "requests==2.33.0",
  "rich==14.3.3",
  "prompt-toolkit==3.0.52",
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  "PyJWT[crypto]==2.12.1",
]

[project.scripts]
hermes = "hermes_cli.main:main"

[tool.setuptools]
py-modules = [
  "run_agent", "model_tools", "toolsets", "cli",
  "hermes_bootstrap", "hermes_constants", "hermes_state",
  "hermes_time", "hermes_logging", "utils", "mcp_serve",
  "toolset_distributions",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "hermes_cli", "hermes_cli.*", "providers", "providers.*"]
