server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内部 DNS，延迟解析避免启动时 upstream 不可达
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Java 认证/用户 → java-user ──
    location /api/v1/auth {
        set $upstream prod-java-user:8001;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/users {
        set $upstream prod-java-user:8001;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Java 业务（已迁移的5个） → java-product ──
    # 使用正则匹配，兼容有无尾部斜杠
    location ~ ^/api/v1/filter-config(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/v1/filter-presets(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/v1/scoring(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/v1/asin-import(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location ~ ^/api/v1/competitor(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── 点击行为追踪 → java-product ──
    location ~ ^/api/v1/click-logs(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── 卖家精灵配置 → java-product ──
    location ~ ^/api/v1/sellersprite-config(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 邓总店铺 → java-product ──
    location ~ ^/api/v1/deng-zong-shop(/.*)?$ {
        set $upstream prod-java-product:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── 其余所有 /api/v1/ → Python 后端 ──
    location /api/v1/ {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # ── 非 v1 API → Python 后端 ──
    location /api/ {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location /dashboards/ {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/dashboards/;
        proxy_set_header Host $host;
    }

    location /health {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/health;
        access_log off;
    }

    location /docs {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/openapi.json;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
