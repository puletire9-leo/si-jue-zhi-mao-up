server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内部 DNS，延迟解析避免启动时 upstream 不可达
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Java API → Gateway（认证 + 路由） ──
    location ~ ^/api/v1/(auth|users|filter-config|filter-presets|scoring|asin-import|competitor|click-logs|sellersprite-config|deng-zong-shop|modules|products|selections|product-sales|materials|carriers)(/.*)?$ {
        proxy_pass http://prod-gateway:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── 其余所有 /api/v1/ → Python 后端 ──
    location /api/v1/ {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # ── 非 v1 API → Python 后端 ──
    location /api/ {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location /dashboards/ {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/dashboards/;
        proxy_set_header Host $host;
    }

    location /health {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/health;
        access_log off;
    }

    location /docs {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $py_upstream prod-backend:7090;
        proxy_pass http://$py_upstream/openapi.json;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
