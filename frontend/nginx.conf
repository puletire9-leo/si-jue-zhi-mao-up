server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传体大小限制 (默认 1MB 太小,会导致 413)
    client_max_body_size 100m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ============================================
    # Java 微服务路由 (经 Gateway, JWT 鉴权)
    # 关键: more specific location 优先匹配
    # ============================================

    # 认证 + 用户
    location ~ ^/api/v1/(auth|users)(/|$) {
        proxy_pass http://gateway:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 选品/竞品/评分/导入 — Java 业务核心
    location ~ ^/api/v1/(competitor|method-cards|product-performance|product-sales|category-baseline|category-dislocation|element-discovery|seller|filter-config|asin-import|scoring|filter-presets|sellersprite-config|click-logs|deng-zong-shop|blue-ocean|clean-layer|subcategory-alias|modules)(/|$) {
        proxy_pass http://gateway:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # product-line: aggregated-data/analysis-results/guidance/tree 走 Java,其他走 Python
    location ~ ^/api/v1/product-line/(aggregated-data|analysis-results|guidance|tree) {
        proxy_pass http://gateway:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ============================================
    # Python 路由 (FastAPI 直连)
    # ============================================

    location /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # ============================================
    # Python 辅助路由 (仪表盘/文档/健康检查)
    # ============================================

    location /dashboards/ {
        proxy_pass http://backend:8090/dashboards/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8090/health;
        access_log off;
    }

    location /docs {
        proxy_pass http://backend:8090/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8090/openapi.json;
    }

    # ============================================
    # 静态资源 + Vue Router history 模式
    # ============================================

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
