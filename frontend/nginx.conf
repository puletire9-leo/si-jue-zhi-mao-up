server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS 自动刷新（backend/celery 重建后 IP 变化时避免 502）
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 后端上游（用变量强制 nginx 按 resolver 刷新 DNS 缓存）
    set $backend_upstream "http://backend:8090";
    set $gateway_upstream "http://gateway:9000";

    # 上传体大小限制 (默认 1MB 太小,会导致 413)
    client_max_body_size 100m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ============================================
    # 安全: 拒绝外部访问 AI 请求中心内部接口
    # ai-center 仅供容器内部服务调用, 绝不经前端暴露
    # ============================================
    location ~ ^/(v1/chat/completions|api/v1/ai/)  {
        return 404;
    }

    # ============================================
    # Java 微服务路由 (经 Gateway, JWT 鉴权)
    # 关键: more specific location 优先匹配
    # ============================================

    # /auth/members 走 Python（无 RBAC 拦截，避免网关 user:manage 403）
    location ^~ /api/v1/auth/members {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 认证 + 用户
    location ~ ^/api/v1/(auth|users)(/|$) {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 选品/竞品/评分/导入/AI选品 — Java 业务核心
    location ~ ^/api/v1/(competitor|method-cards|shop-profile|analysis-baseline|product-performance|product-sales|category-baseline|category-dislocation|element-discovery|seller|filter-config|asin-import|scoring|filter-presets|sellersprite-config|click-logs|deng-zong-shop|blue-ocean|clean-layer|subcategory-alias|modules|ai-selection-pool|nonstandard-carrier|brs-ranking)(/|$) {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # product-line: aggregated-data/analysis-results/guidance/tree 走 Java,其他走 Python
    location ~ ^/api/v1/product-line/(aggregated-data|analysis-results|guidance|tree) {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ============================================
    # Python 路由 (FastAPI 直连)
    # ============================================

    # 大文件下载必须直通客户端，禁止 Nginx 将响应缓冲到 Docker 临时磁盘。
    location ~ ^/api/v1/download-tasks/[^/]+/download$ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 安全: 此路由直连 Python(不经 Gateway)，清除客户端伪造的身份头，
        # 强制 Python 侧只认 Authorization 里的 JWT，避免 X-User-* 伪造越权。
        proxy_set_header X-User-Id "";
        proxy_set_header X-Username "";
        proxy_set_header X-User-Role "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # ============================================
    # Python 辅助路由 (仪表盘/文档/健康检查)
    # ============================================

    location /dashboards/ {
        proxy_pass $backend_upstream/dashboards/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass $backend_upstream/health;
        access_log off;
    }

    location /docs {
        proxy_pass $backend_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $backend_upstream/openapi.json;
    }

    # ============================================
    # 静态资源 + Vue Router history 模式
    # ============================================

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口禁止缓存。发布新版本后，普通刷新必须重新读取 index.html，
    # 再由其中的 hash 文件名加载新 JS，避免旧页面继续调用过期 API 参数。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
