server:
  port: 8002

spring:
  application:
    name: sjzm-product
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13338}/${MYSQL_DATABASE:sijuelishi_dev}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:sijue}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${MYSQL_PRODUCT_POOL_MIN_IDLE:3}
      maximum-pool-size: ${MYSQL_PRODUCT_POOL_MAX_SIZE:15}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:5000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_ENABLED:false}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_CONFIG_ENABLED:false}
        file-extension: yaml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sjzm.product.entity
  configuration:
    map-underscore-to-camel-case: true

redisson:
  address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6380}

sellersprite:
  api-url: ${SELLERSPRITE_API_URL:https://api.sellersprite.com/v1}
  secret-key: ${SELLERSPRITE_SECRET_KEY:}
  connect-timeout: 10s
  read-timeout: 30s
  rate-limit:
    max-per-minute: ${SELLERSPRITE_RATE_LIMIT_PER_MINUTE:40}
    max-per-month: ${SELLERSPRITE_RATE_LIMIT_PER_MONTH:20000}
    max-asins-per-request: 40

bazhuayu:
  base-url: ${BAZHUAYU_BASE_URL:https://openapi.bazhuayu.com}
  username: ${BAZHUAYU_USERNAME:}
  password: ${BAZHUAYU_PASSWORD:}
  connect-timeout: 10s
  read-timeout: 30s
  status-poll-interval-seconds: ${BAZHUAYU_POLL_INTERVAL:5}
  extraction-timeout-minutes: ${BAZHUAYU_EXTRACT_TIMEOUT:60}
  data-page-size: ${BAZHUAYU_PAGE_SIZE:1000}
  drain-max-rows: ${BAZHUAYU_DRAIN_MAX_ROWS:100000}
  task-mapping-json: ${BAZHUAYU_TASKGROUP_MAPPING:}

lingxing:
  base-url: ${LINGXING_BASE_URL:https://openapi.lingxing.com}
  app-id: ${LINGXING_APP_ID:}
  app-secret: ${LINGXING_APP_SECRET:}
  connect-timeout: 10s
  read-timeout: 30s
  scheduled:
    # 每周自动同步产品表现 + 重算产品统一表。默认关，人工验证一轮后再开，避免部署即批量打领星 API。
    enabled: ${LINGXING_SCHEDULED_ENABLED:false}
    # 每周一 03:30（错开整点避开限流高峰）。秒 分 时 日 月 周。
    cron: ${LINGXING_SCHEDULED_CRON:0 30 3 ? * MON}

features:
  ai-selection:
    # Java AI 选品仍是预留代码。完成表结构与迁移前禁止在生产开启。
    enabled: ${AI_SELECTION_ENABLED:false}

schema-guard:
  # 启动期扫描 @TableName 实体并核对 information_schema。
  # 新增 Entity/字段时必须同步提交 java-backend/sql/*.sql 迁移，否则生产启动会失败。
  enabled: ${SCHEMA_GUARD_ENABLED:true}
  fail-fast: ${SCHEMA_GUARD_FAIL_FAST:true}
  check-columns: ${SCHEMA_GUARD_CHECK_COLUMNS:true}
  scan-packages: ${SCHEMA_GUARD_SCAN_PACKAGES:com.sjzm.product}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      permitted-number-of-calls-in-half-open-state: 3
  instances:
    sellerspriteApi:
      base-config: default

logging:
  level:
    root: info
    com.sjzm.product: info
