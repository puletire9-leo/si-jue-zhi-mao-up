# Nacos 服务注册 + 配置中心（开发环境 standalone 模式）
# 使用: docker compose -f docker-compose.nacos.yml up -d
# 控制台: http://localhost:8848/nacos (用户名/密码: nacos/nacos)

services:
  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: sjzm-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    volumes:
      - nacos-logs:/home/nacos/logs
      - nacos-data:/home/nacos/data
    restart: unless-stopped

volumes:
  nacos-logs:
  nacos-data:
