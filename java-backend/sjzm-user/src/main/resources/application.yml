server:
  port: 8001

spring:
  application:
    name: sjzm-user
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3410}/${MYSQL_DATABASE:sijuelishi_dev}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:sijue}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${MYSQL_USER_POOL_MIN_IDLE:2}
      maximum-pool-size: ${MYSQL_USER_POOL_MAX_SIZE:5}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:5000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_ENABLED:false}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_CONFIG_ENABLED:false}
        file-extension: yaml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sjzm.user.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:sjzm-default-secret-key-must-change-in-production-2024}
  expiration: ${JWT_EXPIRATION:604800}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}
  issuer: sjzm-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: info
    com.sjzm.user: debug
