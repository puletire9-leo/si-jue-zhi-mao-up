[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-center"
version = "0.1.0"
description = "集中式 LLM 请求中心 - OpenAI 兼容网关，统一鉴权/模型白名单/上游调用"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.35,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
prod = []
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "asgi-lifespan>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
