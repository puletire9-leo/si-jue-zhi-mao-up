# ============================================
# 思觉智贸 - 生产环境
# 启动: docker compose -f docker-compose.prod.yml up -d
# ============================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:

  # ============================================
  # 基础设施
  # ============================================

  mysql:
    logging: *default-logging
    image: mysql:8.0
    container_name: prod-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-1G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-60}
      # 生产无主从复制，binlog 仅用于短期误操作恢复；强制保留 3-7 天，默认 7 天。
      - --binlog-expire-logs-seconds=${MYSQL_BINLOG_EXPIRE_SECONDS:-604800}
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2g}
    ports:
      - "3310:3306"
    env_file:
      - ./config/public/prod.env
      - ./config/secrets/prod.env
    volumes:
      - prod-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" --connect-timeout=1 -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: prod-redis
    command: redis-server --port 6379
    ports:
      - "6383:6379"
    volumes:
      - prod-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nacos:
    logging: *default-logging
    image: nacos/nacos-server:v2.3.1
    container_name: prod-nacos
    ports:
      - "8852:8848"
      - "9852:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    volumes:
      - prod-nacos-logs:/home/nacos/logs
      - prod-nacos-data:/home/nacos/data
    restart: unless-stopped

  # ============================================
  # Python 后端
  # ============================================

  backend:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: prod-backend:current
    container_name: prod-backend
    ports:
      - "127.0.0.1:7093:8090"
    env_file:
      - ./config/public/prod.env
      - ./config/secrets/prod.env
      - ./config/public/user-prod.env
      - ./config/secrets/user-prod.env
    environment:
      - IMAGE_READ_MODE=cloud
    volumes:
      - prod-logs:/app/logs
      - prod-models:/app/model_cache
      - prod-download-cache:/app/下载缓存
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-download:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: prod-backend:current
    container_name: prod-celery-download
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=10 -Q download_tasks
    env_file:
      - ./config/public/prod.env
      - ./config/secrets/prod.env
      - ./config/public/user-prod.env
      - ./config/secrets/user-prod.env
    volumes:
      - prod-download-cache:/app/下载缓存
      - prod-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================
  # AI 请求中心（集中式 LLM 网关，独立服务）
  # ============================================

  ai-center:
    logging: *default-logging
    build:
      context: ./python-ai/ai-center
      dockerfile: Dockerfile
    image: prod-ai-center:current
    container_name: prod-ai-center
    env_file:
      - ./config/public/prod.env
      - ./config/secrets/prod.env     # 含 DEEPSEEK_API_KEY + AI_CENTER_INTERNAL_KEY
    # 不发布宿主端口，仅容器内部访问 http://ai-center:8012
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8012/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================
  # Java 微服务（共用 Dockerfile.prod，SERVICE_MODULE 区分）
  # ============================================

  java-user:
    logging: *default-logging
    build:
      context: .
      dockerfile: java-backend/Dockerfile.prod
    image: prod-java:current
    container_name: prod-java-user
    ports:
      - "8014:8001"
    env_file:
      - ./config/public/prod.env
      - ./config/secrets/prod.env
      - ./config/public/user-prod.env
      - ./config/secrets/user-prod.env
    environment:
      SERVICE_MODULE: user
      SPRING_PROFILES_ACTIVE: prod
      REDISSON_ADDRESS: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  java-product:
    logging: *default-logging
    build:
      context: .
      dockerfile: java-backend/Dockerfile.prod
    image: prod-java:current
    container_name: prod-java-product
    ports:
      # 仅保留宿主机本地运维入口；外部流量必须经 gateway 执行 JWT/RBAC。
      - "127.0.0.1:8025:8002"
    env_file:
      - ./config/public/prod.env
      - ./config/secrets/prod.env
    environment:
      SERVICE_MODULE: product
      SPRING_PROFILES_ACTIVE: prod
      REDISSON_ADDRESS: redis://redis:6379
      # 产品服务处理八爪鱼 overview 等大型聚合查询，需要更大的堆
      JAVA_OPTS: "-Xms1024m -Xmx2048m"
      # AI 选品功能开关：开启后注册 /api/v1/ai-selection-pool/** 接口（ai_selection 表）
      AI_SELECTION_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  gateway:
    logging: *default-logging
    build:
      context: .
      dockerfile: java-backend/Dockerfile.prod
    image: prod-java:current
    container_name: prod-gateway
    ports:
      - "9003:9000"
    env_file:
      - ./config/public/prod.env
      - ./config/secrets/prod.env
    environment:
      SERVICE_MODULE: gateway
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_AUTH_ENABLED: "true"
    depends_on:
      java-user:
        condition: service_started
      java-product:
        condition: service_started
      nacos:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # 前端（Nginx 静态文件 + API 代理）
  # ============================================

  frontend:
    logging: *default-logging
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: prod-frontend:current
    container_name: prod-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - gateway

# ============================================
# 独立卷
# ============================================

volumes:
  prod-mysql-data:
  prod-redis-data:
  prod-nacos-logs:
  prod-nacos-data:
  prod-logs:
  prod-models:
  prod-download-cache:
