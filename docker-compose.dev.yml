# ============================================
# 思觉智贸 - 开发环境（自包含）
# 启动: docker compose -f docker-compose.dev.yml up -d
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: dev-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3410:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: sijue
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sijue123456}
      MYSQL_DATABASE: sijuelishi_dev
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dev-redis
    command: redis-server --port 6379
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: dev-backend
    container_name: dev-backend
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=sijuelishi_dev
      - MYSQL_USER=sijue
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-sijue123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IMAGE_READ_MODE=cloud
      - BACKUP_DIR=/app/backup
      - JWT_SECRET=${JWT_SECRET:-sjzm-dev-jwt-secret-change-in-production}
      - SECRET_KEY=${SECRET_KEY:-sjzm-dev-secret-key-change-in-production}
    ports:
      - "8090:8090"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      - ./backend/static:/app/static
      - ./backend/logs:/app/logs
      - ./backend/database/backup:/app/backup
      - dev-thumbnails:/app/images/thumbnails
      - dev-models:/app/model_cache
      - dev-download-cache:/app/下载缓存
      - ./产品数据:/app/data:ro
      - ./backend/领星:/app/领星
    command: uvicorn app.main:app --host 0.0.0.0 --port 8090 --reload --reload-dir app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery 异步任务 Worker ──
  celery-worker:
    image: dev-backend
    container_name: dev-celery-worker
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=sijuelishi_dev
      - MYSQL_USER=sijue
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-sijue123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      - ./backend/static:/app/static
      - ./backend/logs:/app/logs
      - ./backend/database/backup:/app/backup
      - dev-thumbnails:/app/images/thumbnails
      - dev-models:/app/model_cache
      - dev-download-cache:/app/下载缓存
      - ./产品数据:/app/data:ro
      - ./backend/领星:/app/领星
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q download_tasks -n worker@%h --concurrency=2 --max-tasks-per-child=10
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: dev-frontend
    working_dir: /app
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      VITE_BACKEND_HOST: backend
      VITE_BACKEND_PORT: "8090"
      VITE_JAVA_HOST: java-product
      VITE_JAVA_PORT: "8002"
      # 选品 Agent SSE 服务（容器间通信）
      VITE_SELECTION_AGENT_HOST: selection-agent-v2
      VITE_SELECTION_AGENT_PORT: "8011"
      # 开发环境默认直连各服务；仅在联调网关时改为 true
      VITE_USE_GATEWAY: "false"
      VITE_GATEWAY_HOST: gateway
      VITE_GATEWAY_PORT: "9000"
    ports:
      - "8179:8179"
    volumes:
      - ./frontend:/app
      - dev-node-modules:/app/node_modules
    command: >
      sh -c "npm install && npx vite --host 0.0.0.0 --port 8179 --strictPort"
    depends_on:
      - backend

  # ── Java 微服务（开发默认不走 gateway / nacos） ──

  java-product:
    image: maven:3.9-eclipse-temurin-21
    container_name: java-product
    working_dir: /app
    ports:
      - "8002:8002"
    volumes:
      - ./java-backend:/app
      - ./docs:/docs:ro
      - java-m2:/root/.m2
    command: >
      sh -c "cd sjzm-product &&
      mvn spring-boot:run -DskipTests
      -Dspring-boot.run.jvmArguments='-Xms256m -Xmx1024m'
      -Dspring-boot.run.arguments='--server.port=8002'"
    environment:
      # 开发默认直连服务，关闭注册中心依赖以加快启动
      NACOS_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sijuelishi_dev
      MYSQL_USERNAME: sijue
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sijue123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDISSON_ADDRESS: redis://redis:6379
      # FIXED: CRIT-2 — 移除硬编码 API Key，改由 .env 注入
      JWT_SECRET: ${JWT_SECRET:-sjzm-dev-jwt-secret-change-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: maven:3.9-eclipse-temurin-21
    container_name: dev-gateway
    profiles:
      - gateway
    working_dir: /app
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./java-backend:/app
      - java-m2:/root/.m2
    command: >
      sh -c "cd sjzm-gateway &&
      mvn spring-boot:run -DskipTests
      -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    environment:
      NACOS_ENABLED: "false"
      SJZM_USER_URI: http://java-user:8001
      SJZM_PRODUCT_URI: http://java-product:8002
      GATEWAY_AUTH_ENABLED: "false"  # 开发环境关闭JWT认证
      JWT_SECRET: ${JWT_SECRET:-sjzm-dev-jwt-secret-change-in-production}
    depends_on:
      - java-user
      - java-product

  java-user:
    image: maven:3.9-eclipse-temurin-21
    container_name: java-user
    working_dir: /app
    ports:
      - "8001:8001"
    volumes:
      - ./java-backend:/app
      - java-m2:/root/.m2
    command: >
      sh -c "cd sjzm-user &&
      mvn spring-boot:run -DskipTests
      -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'
      -Dspring-boot.run.arguments='--server.port=8001'"
    environment:
      NACOS_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sijuelishi_dev
      MYSQL_USERNAME: sijue
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sijue123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDISSON_ADDRESS: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-sjzm-dev-jwt-secret-change-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: dev-nacos
    profiles:
      - nacos
    ports:
      - "8993:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    volumes:
      - nacos-logs:/home/nacos/logs
      - nacos-data:/home/nacos/data
    restart: unless-stopped

  # ── 选品分析 Agent v2 (Hermes 框架) ──

  selection-agent-v2:
    build:
      context: ./selection-agent-v2
      dockerfile: Dockerfile
    image: dev-selection-agent-v2
    container_name: dev-selection-agent-v2
    env_file:
      - ./selection-agent-v2/.env
    environment:
      - JAVA_BASE_URL=http://java-product:8002
      - HERMES_HOME=/root/.hermes
      - PYTHONPATH=/app
      - JWT_SECRET=${JWT_SECRET:-sjzm-dev-jwt-secret-change-in-production}
    ports:
      - "8012:8011"
    volumes:
      - ./selection-agent-v2:/app
    # API 服务由 Dockerfile CMD 启动 (uvicorn api_server:app)
    # 批量分析: docker exec dev-selection-agent-v2 python batch_runner.py
    stdin_open: true
    tty: true
    depends_on:
      java-product:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  java-m2:
  dev-thumbnails:
  dev-models:
  dev-download-cache:
  dev-node-modules:
  nacos-logs:
  nacos-data:
