# 构建并推送后端、前端 Docker 镜像到阿里云 Container Registry
# 规则：
# 1. push 分支：镜像 tag = 分支名（如 main、dev）
# 2. push tag：镜像 tag = tag 名（如 v1.2.3）
# 3. 同时额外打一个 sha-xxxxxxx tag，便于精确回滚
#
# 需在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   ALIYUN_CR_REGISTRY, ALIYUN_CR_USERNAME, ALIYUN_CR_PASSWORD
# 推送后：compose.env 中 MIDWAY_IMAGE / VUE_IMAGE / KEYWORD_RESEARCH_GO_IMAGE 填对应地址（仓库名 + 你要部署的 tag）。
name: Docker build and push (Aliyun ACR)

on:
  push:
    branches: [main, master]
    tags: ['*']
  workflow_dispatch:

env:
  # 阿里云镜像仓库公网地址（CI 在 GitHub 跑用公网；ECS 拉取可用 VPC 地址加速）
  ALIYUN_CR_REGISTRY: ${{ secrets.ALIYUN_CR_REGISTRY }}
  # 镜像命名与阿里云控制台一致：sijue/web-backend、sijue/web-front、sijue/keyword-research-go
  MIDWAY_IMAGE_NAME: sijue/web-backend
  VUE_IMAGE_NAME: sijue/web-front
  KEYWORD_RESEARCH_GO_IMAGE_NAME: sijue/keyword-research-go

jobs:
  build-midway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_CR_REGISTRY }}
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_PASSWORD }}

      - name: Build and push midway
        uses: docker/build-push-action@v5
        with:
          context: ./cool-admin-midway
          file: ./cool-admin-midway/Dockerfile
          push: true
          tags: |
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.MIDWAY_IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.MIDWAY_IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_CR_REGISTRY }}
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_PASSWORD }}

      - name: Build and push vue
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cool-admin-vue/Dockerfile
          build-args: |
            VITE_NAME=艾为
          push: true
          tags: |
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.VUE_IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.VUE_IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-keyword-research-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_CR_REGISTRY }}
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_PASSWORD }}

      - name: Build and push keyword-research-go
        uses: docker/build-push-action@v5
        with:
          context: ./keyword-research-ms-go
          file: ./keyword-research-ms-go/Dockerfile
          push: true
          tags: |
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.KEYWORD_RESEARCH_GO_IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.KEYWORD_RESEARCH_GO_IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
