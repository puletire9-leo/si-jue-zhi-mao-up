services:
  keyword-research-api:
    image: ${KEYWORD_RESEARCH_GO_IMAGE}
    restart: always
    env_file: compose.env
    command: ["/app/bin/api"]
    # 业务配置走 compose.env；此处仅容器固定项（勿用 environment 覆盖 env_file 里的 OXYLABS_* 等）
    environment:
      APP_ENV: production
      TZ: Asia/Shanghai
      DATABASE_PATH: /app/data/keyword_research_go.db
      APP_PORT: "8099"
    volumes:
      - keyword_research_data:/app/data
    ports:
      - "8099:8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  keyword-research-worker:
    image: ${KEYWORD_RESEARCH_GO_IMAGE}
    restart: always
    env_file: compose.env
    command: ["/app/bin/worker"]
    environment:
      APP_ENV: production
      TZ: Asia/Shanghai
      DATABASE_PATH: /app/data/keyword_research_go.db
    volumes:
      - keyword_research_data:/app/data
    depends_on:
      - keyword-research-api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  midway:
    image: ${MIDWAY_IMAGE}
    restart: always
    env_file: compose.env
    # 业务配置走 compose.env（与 config.prod.ts 的 process.env 同名）；勿在此用 environment 覆盖
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
    volumes:
      - ${UPLOADS_HOST_PATH:-/web/amz-listing-optimiser/cool-admin-midway/public/uploads}:/app/public/uploads
    ports:
      - "${APP_PORT:-8001}:8001"
      - "8011:8011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keyword-research-api

  coolVue:
    image: ${VUE_IMAGE}
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - midway

  frps:
    # frp server：用于内网素材服务器通过 frpc 反向打洞过来。
    # 内网机跑 frpc 主动连这里的 7000，云端就能通过 9000 端口反向访问内网 MinIO/HTTP 服务。
    # 镜像建议固定版本，避免 latest 飘移：snowdreamtech/frps:0.61.0 等
    image: docker.m.daocloud.io/snowdreamtech/frps:latest
    container_name: frps
    restart: always
    env_file: compose.env
    volumes:
      - ./frps/frps.toml:/etc/frp/frps.toml:ro
    ports:
      # frpc 接入端口
      - "${FRPS_BIND_PORT:-7000}:7000"
      # Dashboard
      - "${FRPS_DASHBOARD_PORT:-7500}:7500"
      # 给内网 MinIO 映射用（必须和 frps.toml 的 allowPorts 一致）
      - "9000:9000"

volumes:
  keyword_research_data:
